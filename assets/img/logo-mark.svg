<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BH Roofing Metro Detroit">
  <defs>
    <linearGradient id="bhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3d60"/>
      <stop offset="1" stop-color="#0d2035"/>
    </linearGradient>
    <linearGradient id="bhRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8be4c"/>
      <stop offset="1" stop-color="#e8a11b"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bhBg)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#f8be4c" stroke-opacity="0.18"/>
  <!-- roof (gable) -->
  <path d="M32 15 53 33 H45 L32 22 19 33 H11 Z" fill="url(#bhRoof)"/>
  <!-- roof ridge shading -->
  <path d="M32 15 53 33 H49 L32 18.5 Z" fill="#0d2035" fill-opacity="0.10"/>
  <!-- house body under the roof -->
  <path d="M19 33 H45 V49 H19 Z" fill="#f8be4c" fill-opacity="0.16"/>
  <!-- shingle courses -->
  <path d="M23 29 H41 M27 25 H37" stroke="#0d2035" stroke-opacity="0.22" stroke-width="1.3" stroke-linecap="round"/>
  <!-- door -->
  <path d="M29 49 V40 a3 3 0 0 1 6 0 V49 Z" fill="#f8be4c"/>
  <!-- ground line -->
  <rect x="15" y="49" width="34" height="3.2" rx="1.6" fill="#f8be4c"/>
</svg>
